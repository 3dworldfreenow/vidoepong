<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vlog Editor</title>
<style>
:root{--bg:#0c0e11;--pn:#13171c;--pn2:#171c22;--ln:#252c35;--tx:#e8eaed;--mu:#8b95a1;--ac:#e0b66a;--v:#2f6f8f;--a:#3d8a5f;--t:#9a6b2f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,'Segoe UI',sans-serif;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 306px;height:100%;width:100%}
#top{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
#top h1{font:600 13px Georgia,serif;letter-spacing:.2em;color:var(--ac);margin:0 auto 0 0;text-transform:uppercase}
button,select,input,textarea{font:inherit}button,select{background:#1b222a;color:var(--tx);border:1px solid #33404d;border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}button.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
#mid{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;min-height:0;min-width:0}
#bin,#insp{background:var(--pn);overflow:auto;padding:10px}#bin{border-right:1px solid var(--ln)}#insp{border-left:1px solid var(--ln)}
h3{margin:12px 0 6px;font:600 11px system-ui;letter-spacing:.14em;color:var(--ac);text-transform:uppercase}h3:first-child{margin-top:0}
#drop{border:1.5px dashed #3a4654;border-radius:10px;padding:14px;text-align:center;color:var(--mu);margin-bottom:10px;cursor:pointer}#drop.over{border-color:var(--ac);color:var(--ac)}
.mi{display:flex;gap:8px;padding:6px;border-radius:8px;border:1px solid transparent;margin-bottom:4px;align-items:center}.mi:hover{background:#1a2027}
.mi img,.mi .ph{width:64px;height:36px;object-fit:cover;border-radius:4px;background:#0a0c0e;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
.mi .nm{flex:1;min-width:0}.mi b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi small{color:var(--mu)}
.mi button{padding:3px 8px}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px;gap:8px;background:#090a0c}
#pvw{flex:1;min-height:0;min-width:0;position:relative;overflow:hidden}
#cv{position:absolute;left:0;top:0;background:#000;border:1px solid var(--ln)}
#tr{display:flex;align-items:center;gap:10px;justify-content:center}#tc{font:600 15px ui-monospace,Consolas,monospace;min-width:120px;text-align:center;color:var(--ac)}
details{border:1px solid var(--ln);border-radius:8px;margin:8px 0;padding:6px 9px;background:#10151a}summary{cursor:pointer;color:var(--ac);font:600 11px system-ui;letter-spacing:.12em;text-transform:uppercase}details>*:not(summary){margin-top:2px}.btn2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn2 button{flex:1;padding:5px 6px;font-size:12px}
#insp label{display:block;color:var(--mu);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:9px 0 3px}
#insp input[type=text],#insp input[type=number],#insp select,#insp textarea{width:100%;background:#0d1115;color:var(--tx);border:1px solid #2b3540;border-radius:6px;padding:5px 8px;user-select:text}
#insp input[type=color]{width:100%;height:28px;background:none;border:1px solid #2b3540;border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chk{display:flex!important;gap:8px;align-items:center;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;color:var(--tx)!important}
#tl{min-width:0;background:var(--pn);border-top:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#tools{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--ln);flex-wrap:wrap}#tools .sp{flex:1}
#tlb{display:flex;flex:1;min-height:0}#labels{width:74px;flex:none;border-right:1px solid var(--ln);padding-top:24px}
.lb{height:54px;border-bottom:1px solid #1d232a;color:var(--mu);font:600 10px system-ui;letter-spacing:.1em;display:flex;align-items:center;padding-left:8px}
#scroll{flex:1;min-width:0;overflow:auto;position:relative}#inner{position:relative}
#ruler{height:24px;position:sticky;top:0;z-index:5;background:#10141a;border-bottom:1px solid var(--ln);cursor:pointer}
.row{height:54px;border-bottom:1px solid #1d232a;position:relative;background:repeating-linear-gradient(90deg,transparent 0 79px,#161b21 79px 80px)}.row.alt{background-color:#10141a}
.clip{position:absolute;top:4px;height:46px;border-radius:6px;overflow:hidden;cursor:grab;border:1.5px solid rgba(255,255,255,.18);font-size:11px}
.clip.V{background:linear-gradient(#2f6f8f,#265a75)}.clip.A{background:linear-gradient(#3d8a5f,#2f6e4b)}.clip.T{background:linear-gradient(#9a6b2f,#7d5524)}
.clip.sel{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}.clip .lbl{position:absolute;left:8px;top:3px;right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none}
.clip canvas{position:absolute;left:0;bottom:0;width:100%;height:100%;pointer-events:none}.clip .bg{position:absolute;inset:0;background-size:auto 100%;background-repeat:repeat-x;opacity:.45;pointer-events:none}
.clip .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:3;background:rgba(255,255,255,.0)}.clip .h:hover{background:rgba(255,255,255,.45)}.clip .h.l{left:0}.clip .h.r{right:0}
#ph{position:absolute;top:0;bottom:0;width:0;z-index:6;pointer-events:none}#ph:before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:2px;background:#ff5a4f}#ph:after{content:'';position:absolute;left:-7px;top:0;border:7px solid transparent;border-top:11px solid #ff5a4f}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}#modal.open{display:flex}
#box{background:var(--pn2);border:1px solid #33404d;border-radius:14px;padding:22px;width:420px;max-width:92vw}#box h2{margin:0 0 12px;font:600 16px Georgia,serif;color:var(--ac)}
#pb{height:10px;background:#0d1115;border-radius:5px;overflow:hidden;margin:14px 0}#pb i{display:block;height:100%;width:0;background:var(--ac)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a1d1b;border:1px solid #6a3a33;color:#ffb4a0;padding:8px 14px;border-radius:8px;display:none;z-index:60;max-width:80vw}
.badge{font-size:10px;padding:1px 6px;border-radius:9px;background:#2a3340;color:#9fc5e8;margin-left:4px}.badge.err{background:#4a2420;color:#ffb4a0}
</style></head><body>
<div id="app">
<div id="top"><h1>Vlog Editor</h1><span id="sv" style="color:var(--mu)"></span>
<button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="savep">Save project file</button><button id="openp">Open project file</button><input type="file" id="pf" accept=".json" hidden><button id="exp" class="pri">Export MP4</button></div>
<div id="mid">
<div id="bin"><h3>Media</h3><div id="drop">Drop videos, photos, music here<br><u>or click to browse</u></div><input type="file" id="fi" multiple accept="video/*,audio/*,image/*" hidden><div id="mlist"></div><h3>Background sound</h3><div class="g2"><select id="ambK"><option value="river">River stream</option><option value="wind">Soft wind</option><option value="rain">Rain</option><option value="forest">Forest air</option><option value="pad">Cinematic pad</option></select><select id="ambS"><option value="30">30 sec</option><option value="60" selected>1 min</option><option value="180">3 min</option><option value="600">10 min</option></select></div><button id="ambG" style="width:100%;margin-top:6px">Make sound</button><button id="bgUp" class="pri" style="width:100%;margin-top:8px">+ Add my own background sound</button><input type="file" id="bgf" accept="audio/*,video/*" multiple hidden><label style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:12px;margin-top:6px"><input type="checkbox" id="bgLoop" checked> Repeat to fill the whole video</label><p style="color:var(--mu);font-size:11px;margin:6px 0 0">These are generated sounds. For real music, drop your own files above (YouTube Audio Library, Pixabay).</p></div>
<div id="stage"><div id="pvw"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="tr"><button id="tostart">⏮</button><button id="pl" style="min-width:90px">▶ Play</button><span id="tc">0:00.0</span></div></div>
<div id="insp"></div></div>
<div id="tl"><div id="tools">
<button id="split" title="S">✂ Split</button><button id="del" title="Delete">🗑 Delete</button><button id="rdel" title="Shift+Delete">Ripple delete</button><button id="sil">Remove silences</button><button id="dup" title="D">⧉ Duplicate</button><button id="trl" title="Q">◂| Trim start</button><button id="trr" title="W">|▸ Trim end</button><button id="det">♪ Detach audio</button>
<select id="ttype"><option value="title">Title card</option><option value="lower">Lower third</option><option value="chapter">Chapter card</option><option value="sub">Subtitle</option><option value="tracker">Route tracker</option></select><button id="addt">+ Add text</button>
<span class="sp"></span><button id="zo">−</button><span style="color:var(--mu)">zoom</span><button id="zi">+</button></div>
<div id="tlb"><div id="labels"></div><div id="scroll"><div id="inner"><div id="ruler"></div><div id="rows"></div><div id="ph"></div></div></div></div></div>
</div>
<div id="modal"><div id="box"></div></div><div id="toast"></div>
<script>
(function(){
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),W=1920,H=1080;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x)},eo=x=>1-Math.pow(1-clamp(x,0,1),3);
const uid=()=>Math.random().toString(36).slice(2,10);
const TRACKS=[['T1','TEXT','T'],['V2','VIDEO 2','V'],['V1','VIDEO 1','V'],['A1','AUDIO 1','A'],['A2','AUDIO 2','A']];
const defFx=()=>({accent:'#e0b66a',font:'serif',bars:true,ratio:2.39,tag:'',vignette:true,grain:true,flare:true,lut:'cinematic',lutAmt:.7});
let P={clips:[],fx:defFx()},M=[],PK={},sel=null,T=0,playing=false,pps=80,undoS=[],redoS=[];
const clen=c=>Math.max(.04,(c.out-c.in)/Math.max(c.speed||1,.05)),cend=c=>c.start+clen(c);
const end=()=>P.clips.reduce((m,c)=>Math.max(m,cend(c)),0);
const mget=id=>M.find(m=>m.id===id);
const fmt=s=>{const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(1).padStart(4,'0');};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',5000);}
// ---------------- persistence ----------------
let svT;function save(){clearTimeout(svT);$('sv').textContent='…';svT=setTimeout(()=>fetch('/api/project',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(P)}).then(()=>$('sv').textContent='saved').catch(()=>$('sv').textContent='not saved'),700);}
function snap(){undoS.push(JSON.stringify(P));if(undoS.length>120)undoS.shift();redoS=[];}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify(P));P=JSON.parse(undoS.pop());sel=null;all();}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify(P));P=JSON.parse(redoS.pop());sel=null;all();}
function all(){tl();insp();save();}
// ---------------- media bin ----------------
function loadMedia(){return fetch('/api/media').then(r=>r.json()).then(m=>{M=m;bin();if(M.some(x=>x.status==='processing'))setTimeout(loadMedia,2000);});}
function bin(){const L=$('mlist');L.innerHTML='';M.forEach(m=>{const e=document.createElement('div');e.className='mi';
  const th=m.thumb?'<img src="/file/thumb/'+m.thumb+'">':'<div class="ph">'+(m.kind==='audio'?'🎵':'🎞')+'</div>';
  e.innerHTML=th+'<div class="nm"><b title="'+m.name+'">'+m.name+'</b><small>'+m.kind+' · '+fmt(m.dur)+(m.status==='processing'?'<span class="badge">preparing…</span>':m.status==='error'?'<span class="badge err">preview failed</span>':'')+'</small></div><button title="Add at playhead (Shift = video 2)">+</button>'+(m.kind==='video'&&m.hasAudio?'<button title="Get the sound out of this video as a separate audio file">♪</button>':'')+(m.kind==='audio'?'<button title="Use as background sound (fills the video)">BG</button>':'')+'<button title="Remove from library">×</button>';
  const bs=e.querySelectorAll('button');bs[0].onclick=ev=>addMedia(m,ev.shiftKey);const xb=m.kind==='video'&&m.hasAudio?bs[1]:null;if(xb)xb.onclick=()=>{xb.textContent='…';fetch('/api/extract/'+m.id,{method:'POST'}).then(r=>r.json()).then(d=>{if(d.error)toast(d.error);loadMedia();});};if(m.kind==='audio')bs[1].onclick=()=>addBgSound(m);bs[bs.length-1].onclick=()=>{if(P.clips.some(c=>c.media===m.id)){toast('This media is used on the timeline. Delete those clips first.');return;}fetch('/api/media/'+m.id,{method:'DELETE'}).then(loadMedia);};
  e.ondblclick=()=>addMedia(m,false);L.appendChild(e);});}
function upload(files,bg){if(!files||!files.length)return;const fd=new FormData();[...files].forEach(f=>fd.append('files',f));$('drop').innerHTML='Uploading… keep this tab open';
  fetch('/api/upload',{method:'POST',body:fd}).then(r=>r.json()).then(list=>{$('drop').innerHTML='Drop videos, photos, music here<br><u>or click to browse</u>';loadMedia().then(()=>{if(bg)list.filter(x=>x.kind==='audio').forEach(x=>{const m=mget(x.id);if(m)addBgSound(m);});if(bg&&!list.some(x=>x.kind==='audio'))toast('That file has no sound.');});}).catch(()=>{toast('Upload failed');});}
$('drop').onclick=()=>$('fi').click();$('fi').onchange=e=>{upload(e.target.files);e.target.value='';};
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over');};$('drop').ondragleave=()=>$('drop').classList.remove('over');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');upload(e.dataTransfer.files);};
function addBgSound(m){snap();const vEnd=P.clips.filter(c=>c.track!=='A1'&&c.track!=='A2').reduce((x,c)=>Math.max(x,cend(c)),0)||m.dur,loop=$('bgLoop').checked,total=loop?vEnd:Math.min(m.dur,vEnd||m.dur);
  const busy=tr=>P.clips.some(c=>c.track===tr&&c.start<total&&cend(c)>0);const tr=!busy('A1')?'A1':'A2';let st=0,first=null,last=null;
  while(st<total-.05){const len=Math.min(m.dur,total-st),c={id:uid(),track:tr,media:m.id,start:st,in:0,out:len,speed:1,vol:.5,fadeIn:0,fadeOut:0,mute:false,duck:true};P.clips.push(c);first=first||c;last=c;st+=len;if(!loop)break;}
  if(first){first.fadeIn=Math.min(1.5,first.out/2);last.fadeOut=Math.min(2,last.out/2);sel=first.id;}all();toast('Background sound added on '+(tr==='A1'?'Audio 1':'Audio 2')+(loop&&m.dur<vEnd?' (repeated to fill the video)':'')+'. Change its volume in the right panel.');}
function freeStart(track,start,len){const cl=P.clips.filter(c=>c.track===track);if(!cl.some(c=>start<cend(c)-.001&&start+len>c.start+.001))return start;return cl.reduce((m,c)=>Math.max(m,cend(c)),0);}
function addMedia(m,v2){snap();const track=m.kind==='audio'?'A1':(v2?'V2':'V1'),len=m.kind==='image'?5:m.dur;
  const c={id:uid(),track,media:m.id,start:freeStart(track,T,len),in:0,out:len,speed:1,vol:m.kind==='audio'?.6:1,fadeIn:m.kind==='audio'?1:0,fadeOut:m.kind==='audio'?1.5:0,mute:false,fit:'contain',duck:m.kind==='audio'};P.clips.push(c);sel=c.id;all();}
// ---------------- cinematic text (same look as the overlay studio) ----------------
const SERIF='"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman","Noto Serif Devanagari","Noto Sans Devanagari",serif',SANS='Montserrat,Inter,"Segoe UI","Noto Sans Devanagari","DejaVu Sans",sans-serif';
const F1=()=>P.fx.font==='serif'?SERIF:SANS,F2=()=>P.fx.font==='serif'?SANS:SERIF,dev=s=>/[ऀ-ॿ]/.test(s);
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function spaced(g,t,x,y,sp,al){if(dev(t)||!sp){g.textAlign=al||'left';g.fillText(t,x,y);return;}const ws=[...t].map(ch=>g.measureText(ch).width),tot=ws.reduce((a,b)=>a+b,0)+sp*(t.length-1);let cx=al==='center'?x-tot/2:al==='right'?x-tot:x;g.textAlign='left';[...t].forEach((ch,i)=>{g.fillText(ch,cx,y);cx+=ws[i]+sp;});}
function glow(g,c,b){g.shadowColor=c;g.shadowBlur=b;}
function flare(g,cx,y,w,a,col){if(a<=0)return;g.save();g.globalCompositeOperation='lighter';g.translate(cx,y);g.scale(1,.014);const r=g.createRadialGradient(0,0,0,0,0,w);r.addColorStop(0,'rgba(255,245,225,'+(.9*a)+')');r.addColorStop(.15,col);r.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=r;g.fillRect(-w,-w,w*2,w*2);g.restore();}
const barH=()=>P.fx.bars?(H-W/P.fx.ratio)/2:0;
function drawText(g,it,t){const G=P.fx,A=G.accent,d=it.d,a=Math.min(ease(t/.9),ease((d-t)/.9)),ain=eo(t/1.6),bh=barH();if(a<=0)return;g.save();g.textBaseline='middle';
  if(it.type==='title'){g.fillStyle='rgba(0,0,0,'+(.38*a)+')';g.fillRect(0,0,W,H);const cy=H/2-10;g.globalAlpha=a;const L=lerp(0,330,ain);g.strokeStyle=rgba(A,.85);g.lineWidth=2;g.beginPath();g.moveTo(W/2-L-20,cy-130);g.lineTo(W/2-20,cy-130);g.moveTo(W/2+20,cy-130);g.lineTo(W/2+L+20,cy-130);g.stroke();
    g.fillStyle=A;g.save();g.translate(W/2,cy-130);g.rotate(Math.PI/4);g.fillRect(-6,-6,12,12);g.restore();
    g.fillStyle='#f4efe6';g.font='500 96px '+F1();glow(g,'rgba(0,0,0,.7)',30);spaced(g,it.a.toUpperCase(),W/2,cy,lerp(50,14,ain),'center');g.shadowBlur=0;
    g.fillStyle=A;g.font='italic 400 52px '+F1();glow(g,rgba(A,.45),22);spaced(g,it.b,W/2,cy+96,2,'center');g.shadowBlur=0;
    g.fillStyle='rgba(235,230,220,.8)';g.font='500 24px '+F2();spaced(g,it.c.toUpperCase(),W/2,cy+170,lerp(30,16,ain),'center');g.globalAlpha=1;if(G.flare)flare(g,lerp(W*.2,W*.8,eo(t/d)),cy-40,900,a*.8,rgba(A,.5));}
  else if(it.type==='chapter'){g.fillStyle='rgba(0,0,0,'+(.5*a)+')';g.fillRect(0,0,W,H);g.globalAlpha=a;g.fillStyle=A;g.font='600 28px '+F2();spaced(g,it.c.toUpperCase(),W/2,H/2-110,lerp(40,20,ain),'center');
    g.fillStyle='#f4efe6';g.font='500 128px '+F1();glow(g,'rgba(0,0,0,.7)',28);spaced(g,it.a,W/2,H/2,lerp(14,4,ain),'center');g.shadowBlur=0;
    g.strokeStyle=rgba(A,.9);g.lineWidth=3;const L=lerp(0,150,ain);g.beginPath();g.moveTo(W/2-L,H/2+90);g.lineTo(W/2+L,H/2+90);g.stroke();
    g.fillStyle='rgba(235,230,220,.85)';g.font='italic 400 44px '+F1();spaced(g,it.b,W/2,H/2+150,1,'center');g.globalAlpha=1;if(G.flare)flare(g,lerp(-200,W+200,eo(t/d)),H/2+10,800,a*.7,rgba(A,.45));}
  else if(it.type==='lower'){const x=150,y=H-bh-150,off=(1-ain)*-60;const gr=g.createLinearGradient(0,y-200,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+(.55*a)+')');g.fillStyle=gr;g.fillRect(0,y-200,W*.7,H-y+200);g.globalAlpha=a;
    g.fillStyle=A;g.fillRect(x-30,y-85+(1-ain)*70,4,170-(1-ain)*70);g.fillStyle=A;g.font='600 24px '+F2();spaced(g,it.c.toUpperCase(),x+off,y-62,lerp(24,10,ain),'left');
    g.fillStyle='#f4efe6';g.font='500 84px '+F1();glow(g,'rgba(0,0,0,.65)',22);spaced(g,it.a,x+off,y+2,lerp(10,2,ain),'left');g.shadowBlur=0;g.fillStyle='rgba(235,230,220,.85)';g.font='italic 400 34px '+F1();spaced(g,it.b,x+off,y+70,1,'left');g.globalAlpha=1;}

    const k2=keep.map(([a,b])=>[Math.max(a,c.in),Math.min(b,c.out)]).filter(([a,b])=>b-a>.15);if(!k2.length||k2.length===1&&Math.abs(k2[0][1]-k2[0][0]-(c.out-c.in))<.2)return toast('No silences found in this clip.');
    snap();const sp=c.speed||1,oldEnd=cend(c);let x=c.start;const out=k2.map(([a,b],i)=>{const n=JSON.parse(JSON.stringify(c));n.id=uid();n.in=a;n.out=b;n.start=x;n.fadeIn=i?0:c.fadeIn;n.fadeOut=i===k2.length-1?c.fadeOut:0;x+=(b-a)/sp;return n;});
    const removed=oldEnd-x;P.clips=P.clips.filter(k=>k.id!==c.id);P.clips.forEach(k=>{if(k.track===c.track&&k.start>=oldEnd-.001)k.start=Math.max(0,k.start-removed);});P.clips.push(...out);sel=out[0].id;all();toast('Removed '+removed.toFixed(1)+' s of silence ('+k2.length+' clips).');}).catch(()=>{$('sil').textContent='Remove silences';toast('Silence detection failed');});};
// ---------------- inspector ----------------
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function num(label,key,c,step,min,max){return '<div><label>'+label+'</label><input type="number" data-k="'+key+'" step="'+step+'" min="'+min+'" '+(max!=null?'max="'+max+'"':'')+' value="'+(+((c[key]!=null?c[key]:0)).toFixed(3))+'"></div>';}
function rg(label,key,c,min,max,step,def){const v=c[key]==null?def:c[key];return '<label>'+label+' <span style="color:var(--ac)">'+(+v).toFixed(2)+'</span></label><input type="range" data-k="'+key+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'" style="width:100%">';}
function lutOpts(cur,none){return '<option value="">'+none+'</option>'+LUTS.list.map(l=>'<option value="'+l.id+'"'+(l.id===cur?' selected':'')+'>'+esc(l.label)+'</option>').join('');}
function insp(){const E=$('insp'),c=selClip(),G=P.fx;let h='';
  if(c){const m=mget(c.media),isT=c.track==='T1',isV=c.track==='V1'||c.track==='V2',isA=c.track==='A1'||c.track==='A2';h+='<h3>'+(isT?'Text clip':m?esc(m.name):'Clip')+'</h3>';
    if(isT){const L=c.text;h+='<label>Style</label><select data-t="type">'+['title','lower','chapter','sub','tracker'].map(v=>'<option'+(v===L.type?' selected':'')+'>'+v+'</option>').join('')+'</select>'+
      '<label>'+(L.type==='tracker'?'Stops (use | between)':'Main text')+'</label><input type="text" data-t="a" value="'+esc(L.a)+'"><label>'+(L.type==='tracker'?'Active stop number':'Second line')+'</label><input type="text" data-t="b" value="'+esc(L.b)+'"><label>Small tag line</label><input type="text" data-t="c" value="'+esc(L.c)+'">'+
      '<div class="g2">'+num('Start (s)','start',c,.1,0)+num('Length (s)','out',c,.5,2)+'</div>';}
    else{h+='<div class="g2">'+num('Start (s)','start',c,.1,0)+num('Speed','speed',c,.05,.25,4)+'</div><div class="g2">'+num('Trim in (s)','in',c,.1,0)+num('Trim out (s)','out',c,.1,0)+'</div><div class="g2">'+num('Fade in (s)','fadeIn',c,.1,0)+num('Fade out (s)','fadeOut',c,.1,0)+'</div>';
      if(isV&&m&&m.kind!=='audio'){
        h+='<details open><summary>Colour</summary>'+rg('Brightness','brightness',c,-.3,.3,.01,0)+rg('Contrast','contrast',c,.7,1.5,.01,1)+rg('Saturation','saturation',c,0,2,.01,1)+rg('Warm ↔ cool (temperature)','temp',c,-1,1,.02,0)+rg('Sharpen','sharpen',c,0,1,.05,0)+
          '<label>Colour look (LUT)</label><select data-k="lut">'+lutOpts(c.lut||'','None')+'</select>'+rg('LUT strength','lutAmt',c,0,1,.05,1)+'<div class="btn2"><button id="b_auto">✨ Auto enhance</button><button id="b_rc">Reset colour</button></div></details>'+
          '<details><summary>Reframe / zoom</summary>'+rg('Zoom','zoom',c,1,3,.02,1)+rg('Move left ↔ right','panX',c,-.5,.5,.01,0)+rg('Move up ↔ down','panY',c,-.5,.5,.01,0)+'<label>Picture fit</label><select data-k="fit"><option value="contain"'+(c.fit!=='cover'?' selected':'')+'>Fit (black bars)</option><option value="cover"'+(c.fit==='cover'?' selected':'')+'>Fill (crop)</option></select></details>';}
      if(m&&m.hasAudio){h+='<details open><summary>Sound</summary>'+rg('Volume','vol',c,0,2,.05,1)+(isV?'<label class="chk"><input type="checkbox" data-k="mute"'+(c.mute?' checked':'')+'> Mute this clip\'s sound</label>':'')+
          (isA?'<label class="chk"><input type="checkbox" data-k="duck"'+(c.duck?' checked':'')+'> Auto-lower under my voice</label>':'')+'<label class="chk"><input type="checkbox" data-k="voiceFx"'+(c.voiceFx?' checked':'')+'> Clean voice (cut noise, EQ, compress)</label><small style="color:var(--mu)">Preview plays up to 100%; export applies the full level. Voice clean-up and ducking are heard in the exported file.</small></details>';}
      h+='<details><summary>Replace / tools</summary>';
      if(isV&&m&&m.hasAudio)h+='<div class="btn2"><button id="b_det">♪ Detach audio to Audio 1</button></div>';
      const alts=M.filter(x=>x.id!==c.media&&(m&&m.kind==='audio'?x.kind==='audio':x.kind!=='audio'));if(alts.length)h+='<label>Replace this clip with…</label><select id="b_rep"><option value="">Choose media</option>'+alts.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select>';
      const auds=M.filter(x=>x.kind==='audio'&&x.id!==c.media);if(isV&&auds.length)h+='<label>Replace its sound with…</label><select id="b_rsnd"><option value="">Choose audio</option>'+auds.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select>';
      h+='</details>';}
  }else h+='<h3>Clip</h3><p style="color:var(--mu)">Click a clip on the timeline to edit it.<br>Space play · S split · D duplicate · Q / W trim to playhead · Delete remove.</p>';
  h+='<h3>Look (whole video)</h3><label>Colour grade (LUT)</label><select data-f="lut">'+lutOpts(G.lut||'','None')+'</select>'+rg('Grade strength','lutAmt',G,0,1,.05,.7).replace('data-k','data-f')+'<div class="btn2"><button id="b_lut">Load your own .cube LUT</button></div><input type="file" id="lutf" accept=".cube" hidden>'+
   '<label>Accent colour</label><input type="color" data-f="accent" value="'+G.accent+'"><label>Text font style</label><select data-f="font"><option value="serif"'+(G.font==='serif'?' selected':'')+'>Cinematic serif</option><option value="sans"'+(G.font==='sans'?' selected':'')+'>Modern sans</option></select>'+
   '<label>Tag in the top bar</label><input type="text" data-f="tag" value="'+esc(G.tag)+'"><label>Aspect ratio</label><select data-f="ratio">'+[[2.39,'2.39 : 1 Scope'],[2,'2 : 1'],[1.85,'1.85 : 1']].map(([v,t])=>'<option value="'+v+'"'+(+G.ratio===v?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
   [['bars','Letterbox bars'],['vignette','Vignette'],['grain','Film grain'],['flare','Light flare on titles']].map(([k,t])=>'<label class="chk"><input type="checkbox" data-f="'+k+'"'+(G[k]?' checked':'')+'> '+t+'</label>').join('');
  E.innerHTML=h;
  const bump=el=>{const sp=el.previousElementSibling&&el.previousElementSibling.querySelector('span');if(sp)sp.textContent=(+el.value).toFixed(2);};
  E.querySelectorAll('[data-k]').forEach(el=>{const apply=()=>{const k=el.dataset.k;let v=el.type==='checkbox'?el.checked:(el.type==='range'||el.type==='number')?+el.value:el.value;if(k==='out'&&c.track==='T1')v=Math.max(2,v);if(k==='speed')v=clamp(v,.25,4);c[k]=v;
      const m=mget(c.media);if(c.track!=='T1'&&m&&['in','out','start'].includes(k)){if(m.kind!=='image'){c.in=clamp(c.in,0,m.dur);c.out=clamp(c.out,c.in+.1,m.dur);}else c.out=Math.max(c.in+.1,c.out);}c.start=Math.max(0,c.start);};
    if(el.type==='range'){el.oninput=()=>{if(!el._s){snap();el._s=1;}apply();bump(el);};el.onchange=()=>{el._s=0;tl();save();};}else el.onchange=()=>{snap();apply();tl();save();if(el.tagName==='SELECT'&&el.dataset.k==='lut')insp();};});
  E.querySelectorAll('[data-t]').forEach(el=>{el.oninput=()=>{c.text[el.dataset.t]=el.value;tl();save();};if(el.tagName==='SELECT')el.onchange=()=>{snap();c.text.type=el.value;insp();tl();save();};});
  E.querySelectorAll('[data-f]').forEach(el=>{const k=el.dataset.f;if(el.type==='range'){el.oninput=()=>{if(!el._s){snap();el._s=1;}P.fx[k]=+el.value;bump(el);};el.onchange=()=>{el._s=0;save();};}
    else{el.onchange=()=>{snap();P.fx[k]=el.type==='checkbox'?el.checked:k==='ratio'?+el.value:el.value;save();};if(el.type==='text'||el.type==='color')el.oninput=()=>{P.fx[k]=el.value;save();};}});
  const B=id=>E.querySelector('#'+id);
  if(B('b_rc'))B('b_rc').onclick=()=>{snap();['brightness','contrast','saturation','temp','sharpen','lut','lutAmt'].forEach(k=>delete c[k]);insp();save();};
  if(B('b_auto'))B('b_auto').onclick=()=>{const b=B('b_auto');b.textContent='Analysing…';const m=mget(c.media);fetch('/api/analyze/'+m.id+'?t='+(m.kind==='image'?0:c.in)+'&d='+Math.min(8,c.out-c.in)).then(r=>r.json()).then(d=>{if(d.error){toast(d.error);b.textContent='✨ Auto enhance';return;}snap();Object.assign(c,d.adj);insp();save();toast('Auto-enhanced: brightness '+d.adj.brightness+', contrast '+d.adj.contrast+', saturation '+d.adj.saturation+'. Fine-tune with the sliders.');}).catch(()=>{b.textContent='✨ Auto enhance';toast('Could not analyse this clip.');});};
  if(B('b_det'))B('b_det').onclick=detach;
  if(B('b_rep'))B('b_rep').onchange=e=>{const m=mget(e.target.value);if(!m)return;snap();const len=clen(c)*(c.speed||1);c.media=m.id;c.in=0;c.out=m.kind==='image'?Math.max(len,2):Math.min(m.dur,len);delete EL[c.id];all();};
  if(B('b_rsnd'))B('b_rsnd').onchange=e=>{const m=mget(e.target.value);if(!m)return;snap();c.mute=true;const tr=P.clips.some(k=>k.track==='A1'&&k.start<cend(c)&&cend(k)>c.start)?'A2':'A1';
    P.clips.push({id:uid(),track:tr,media:m.id,start:c.start,in:0,out:Math.min(m.dur,clen(c)),speed:1,vol:1,fadeIn:.3,fadeOut:.5,duck:false});all();};
  if(B('b_lut'))B('b_lut').onclick=()=>B('lutf').click();
  if(B('lutf'))B('lutf').onchange=e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);fetch('/api/lut',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{if(d.error){toast(d.error);return;}LUTS.list.push(d);snap();P.fx.lut=d.id;if(!P.fx.lutAmt)P.fx.lutAmt=.8;insp();save();});};}
function detach(){const c=selClip();const m=c&&mget(c.media);if(!c||!m||!m.hasAudio||m.kind!=='video'||c.mute)return toast('Select a video clip that still has its own sound.');snap();
  const tr=P.clips.some(k=>k.track==='A1'&&k.start<cend(c)-.01&&cend(k)>c.start+.01)?'A2':'A1';const a=JSON.parse(JSON.stringify(c));a.id=uid();a.track=tr;a.mute=false;a.duck=false;delete a.lut;delete a.zoom;P.clips.push(a);c.mute=true;sel=a.id;all();toast('Sound is now on '+(tr==='A1'?'Audio 1':'Audio 2')+'. You can cut, move, replace or delete it separately.');}
function dupClip(){const c=selClip();if(!c)return;snap();const b=JSON.parse(JSON.stringify(c));b.id=uid();b.start=cend(c);P.clips.push(b);sel=b.id;all();}
function trimTo(side){const c=selClip();if(!c||T<=c.start+.05||T>=cend(c)-.05)return toast('Select a clip and put the playhead inside it.');snap();const sp=c.speed||1;
  if(side==='l'){const d=T-c.start;if(c.track==='T1')c.out-=d;else c.in+=d*sp;c.start=T;}else{if(c.track==='T1')c.out=T-c.start;else c.out=c.in+(T-c.start)*sp;}all();}
$('dup').onclick=dupClip;$('trl').onclick=()=>trimTo('l');$('trr').onclick=()=>trimTo('r');$('det').onclick=detach;
$('bgUp').onclick=()=>$('bgf').click();$('bgf').onchange=e=>{upload(e.target.files,true);e.target.value='';};
$('ambG').onclick=()=>{const b=$('ambG');b.textContent='Making sound…';b.disabled=true;fetch('/api/ambience',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:$('ambK').value,seconds:+$('ambS').value})}).then(r=>r.json()).then(d=>{b.textContent='Make sound';b.disabled=false;if(d.error){toast(d.error);return;}loadMedia().then(()=>{const m=mget(d.id);if(m)addBgSound(m);});}).catch(()=>{b.textContent='Make sound';b.disabled=false;toast('Could not make the sound.');});};
// ---------------- keyboard & top bar ----------------
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();setPlay(!playing);}else if(e.key==='s'||e.key==='S'){if(!e.ctrlKey&&!e.metaKey)split();}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del(e.shiftKey);}
  else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redo():undo();}else if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo();}
  else if(e.key==='d'||e.key==='D'){dupClip();}else if(e.key==='q'||e.key==='Q'){trimTo('l');}else if(e.key==='w'||e.key==='W'){trimTo('r');}
  else if(e.key==='ArrowLeft'){T=Math.max(0,T-(e.shiftKey?1:1/30));}else if(e.key==='ArrowRight'){T+=(e.shiftKey?1:1/30);}else if(e.key==='Home'){T=0;}else if(e.key==='End'){T=end();}
  else if(e.key==='+'||e.key==='='){$('zi').click();}else if(e.key==='-'){$('zo').click();}});
$('undo').onclick=undo;$('redo').onclick=redo;
$('savep').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,1)],{type:'application/json'}));a.download='vlog-project.json';a.click();};
$('openp').onclick=()=>$('pf').click();$('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.clips||!o.fx)throw 0;snap();P=o;sel=null;all();}catch(x){toast('Not a project file from this editor.');}});e.target.value='';};
// ---------------- export ----------------
function pngOf(draw){const c=document.createElement('canvas');c.width=W;c.height=H;draw(c.getContext('2d'));return c.toDataURL('image/png');}
$('exp').onclick=()=>{if(!P.clips.length)return toast('The timeline is empty.');const B=$('box');
  B.innerHTML='<h2>Export MP4</h2><label style="color:var(--mu);font-size:12px">Resolution</label><br><select id="xr"><option value="1080">1080p (1920×1080)</option><option value="720">720p (1280×720)</option></select> <select id="xq"><option value="18">High quality (slower)</option><option value="23">Balanced</option><option value="28">Quick draft</option></select><label class="chk" style="display:flex;gap:8px;margin-top:10px"><input type="checkbox" id="xl" checked> YouTube loudness (−14 LUFS)</label><div id="pb"><i></i></div><div id="xs" style="color:var(--mu)">Length: '+fmt(end())+'. Text clips are exported with a fade in / fade out.</div><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button id="xc">Close</button><button id="xg" class="pri">Start export</button></div>';
  $('modal').classList.add('open');$('xc').onclick=()=>$('modal').classList.remove('open');
  $('xg').onclick=()=>{$('xg').disabled=true;$('xs').textContent='Preparing…';const ov={},fl=P.fx.flare;P.fx.flare=false;
    P.clips.filter(c=>c.track==='T1').forEach(c=>{const hold=clamp(2.5,.9,c.out-.9);ov[c.id]=pngOf(g=>drawText(g,{type:c.text.type,a:c.text.a,b:c.text.b,c:c.text.c,d:c.out},hold));});P.fx.flare=fl;
    const fx=pngOf(g=>drawFx(g,false)),q=+$('xq').value;
    fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:P,overlays:ov,fx,opts:{res:$('xr').value,fps:30,loudnorm:$('xl').checked,crf:q,preset:q>=28?'veryfast':q>=23?'fast':'medium'}})}).then(r=>r.json()).then(d=>{if(d.error){$('xs').textContent=d.error;$('xg').disabled=false;return;}
      const poll=()=>fetch('/api/export/'+d.job).then(r=>r.json()).then(s=>{$('pb').firstChild.style.width=Math.round((s.progress||0)*100)+'%';
        if(s.state==='running'){$('xs').textContent='Rendering… '+Math.round((s.progress||0)*100)+'%';setTimeout(poll,800);}
        else if(s.state==='done'){$('xs').innerHTML='Done · '+(s.size/1048576).toFixed(1)+' MB · <a style="color:var(--ac)" href="/file/out/'+s.file+'" download="vlog.mp4">Download MP4</a>';$('xg').disabled=false;}
        else{$('xs').innerHTML='<span style="color:#ffb4a0">Export failed.</span><pre style="white-space:pre-wrap;max-height:160px;overflow:auto;font-size:11px;user-select:text">'+(s.error||'').replace(/</g,'&lt;')+'</pre>';$('xg').disabled=false;}});poll();}).catch(()=>{$('xs').textContent='Could not reach the server.';$('xg').disabled=false;});};};
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open');};
// ---------------- start ----------------
loadLuts().catch(()=>{}).then(()=>fetch('/api/project')).then(r=>r.json()).then(p=>{if(p&&p.clips&&p.fx){P=p;P.fx=Object.assign(defFx(),P.fx);}}).catch(()=>{}).then(()=>loadMedia()).then(()=>{tl();insp();fitCv();requestAnimationFrame(loop);});
window.__ed={LUTS,P:()=>P,addMedia,M:()=>M,setT:t=>{T=t;},split,sel:id=>{sel=id;insp();tlSel();},undo,tl};
})();
</script></body></html>
